<h3>Listado de heroes</h3>

<div *ngIf="deletedHero; else NadaBorrado">
<h3>Heroe borrado <small style="color: brown;">{{deletedHero}}</small></h3>
</div>

<ng-template #NadaBorrado>
<h3>No se ha borrado nada</h3>
</ng-template>

<button 
*ngIf="heroNames.length > 0"
(click)="removeLastHero()" 
class = "btn btn-outline-danger">
    Borrar ultimo heroe
</button>



<ul class="mt-2 list-group">
    <li *ngFor="let name of heroNames" 
        class="list-group-item">
        <strong>{{ name }}</strong>
    </li>
</ul>
